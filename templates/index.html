<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH Volume Ignition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117; color: #c9d1d9; min-height: 100vh;
        }
        
        .header {
            background: #161b22; padding: 12px 20px; border-bottom: 1px solid #30363d;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header h1 { color: #58a6ff; font-size: 18px; font-weight: 600; }
        
        .status-row { display: flex; gap: 12px; align-items: center; }
        .status-badge { 
            padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
        }
        .status-live { background: #238636; color: #fff; }
        .status-waiting { background: #6e7681; color: #fff; }
        
        /* Compact Health Bar */
        .health-bar {
            display: flex; gap: 1px; background: #30363d;
        }
        .health-item {
            flex: 1; background: #161b22; padding: 8px 12px; text-align: center;
        }
        .health-label { font-size: 9px; color: #6e7681; text-transform: uppercase; }
        .health-value { font-size: 14px; font-weight: 600; color: #fff; }
        .health-item.good .health-value { color: #3fb950; }
        .health-item.warn .health-value { color: #d29922; }
        .health-item.bad .health-value { color: #f85149; }
        
        /* Main Content */
        .main { padding: 16px; }
        
        .section-title {
            font-size: 11px; color: #6e7681; text-transform: uppercase; letter-spacing: 0.5px;
            margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
        }
        .section-title .count { 
            background: #30363d; padding: 2px 8px; border-radius: 10px; font-size: 10px;
        }
        
        /* Candidates Grid */
        .candidates { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
        
        .candidate {
            background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px;
            border-left: 3px solid #f85149;
        }
        .candidate.ignition { border-left-color: #f85149; }
        .candidate.accelerating { border-left-color: #d29922; }
        .candidate.forming { border-left-color: #58a6ff; }
        
        .candidate-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }
        .token-address { font-family: monospace; font-size: 12px; color: #fff; font-weight: 600; }
        .token-state { 
            padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600;
            background: #f85149; color: #fff;
        }
        .token-state.IGNITION { background: #f85149; }
        .token-state.ACCELERATING { background: #d29922; }
        .token-state.FORMING { background: #58a6ff; }
        
        .candidate-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .metric { }
        .metric-label { font-size: 9px; color: #6e7681; }
        .metric-value { font-size: 13px; font-weight: 600; color: #fff; }
        
        .candidate-age { font-size: 10px; color: #6e7681; margin-top: 6px; }
        
        /* Collapsible Live Events */
        .events-section { margin-top: 16px; }
        .events-toggle {
            background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 10px 14px;
            cursor: pointer; width: 100%; text-align: left; color: #c9d1d9; font-size: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .events-toggle:hover { background: #21262d; }
        .events-toggle .arrow { transition: transform 0.2s; }
        .events-toggle.open .arrow { transform: rotate(90deg); }
        
        .events-content { display: none; padding-top: 10px; }
        .events-content.open { display: block; }
        
        .event-item {
            background: #161b22; border: 1px solid #30363d; border-radius: 4px;
            padding: 6px 10px; margin-bottom: 4px; font-size: 11px;
            display: flex; justify-content: space-between;
        }
        .event-time { color: #6e7681; font-size: 10px; }
        
        .empty-state {
            text-align: center; padding: 30px; color: #6e7681;
        }
        
        .unknown { color: #6e7681; font-style: italic; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔥 RH Volume Ignition</h1>
        <div class="status-row">
            <span id="ignition-count" class="status-badge" style="background:#f85149;color:#fff;">0 IGNITION</span>
            <span id="global-status" class="status-badge status-waiting">STARTING</span>
        </div>
    </div>
    
    <!-- Compact Health Bar -->
    <div class="health-bar">
        <div class="health-item" id="health-chain">
            <div class="health-label">Chain</div>
            <div class="health-value unknown">--</div>
        </div>
        <div class="health-item" id="health-lag">
            <div class="health-label">Lag</div>
            <div class="health-value">--</div>
        </div>
        <div class="health-item" id="health-eps">
            <div class="health-label">Events/s</div>
            <div class="health-value">--</div>
        </div>
        <div class="health-item" id="health-tokens">
            <div class="health-label">Tokens</div>
            <div class="health-value">--</div>
        </div>
        <div class="health-item" id="health-ignitions">
            <div class="health-label">Ignitions</div>
            <div class="health-value" style="color:#f85149">0</div>
        </div>
    </div>
    
    <div class="main">
        <!-- Ignition Candidates -->
        <div class="section-title">
            <span>🔥 Top Ignition Candidates</span>
            <span class="count" id="candidates-count">0</span>
        </div>
        <div id="candidates-container">
            <div class="empty-state">Waiting for ignition signals...</div>
        </div>
        
        <!-- Active Reawakenings -->
        <div class="section-title" style="margin-top:16px;">
            <span>🌙 Active Reawakenings</span>
            <span class="count" id="reawakenings-count">0</span>
        </div>
        <div id="reawakenings-container">
            <div class="empty-state">No reawakening tokens detected</div>
        </div>
        
        <!-- Collapsible Live Events -->
        <div class="events-section">
            <button class="events-toggle" onclick="toggleEvents()">
                <span>📡 Live Events</span>
                <span class="arrow">▶</span>
            </button>
            <div class="events-content" id="events-content">
                <div id="events-list"></div>
            </div>
        </div>
    </div>
    
    <script>
        let eventsOpen = false;
        
        function toggleEvents() {
            eventsOpen = !eventsOpen;
            document.querySelector('.events-toggle').classList.toggle('open', eventsOpen);
            document.getElementById('events-content').classList.toggle('open', eventsOpen);
            document.querySelector('.events-toggle .arrow').textContent = eventsOpen ? '▼' : '▶';
        }
        
        function formatNumber(n) {
            if (n === 'UNKNOWN' || n === null || n === undefined || isNaN(n)) return '--';
            if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
            if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
            if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
            return new Intl.NumberFormat().format(n);
        }
        
        function formatAge(ts) {
            if (!ts) return '--';
            const age = (Date.now() - new Date(ts).getTime()) / 1000;
            if (age < 60) return Math.floor(age) + 's ago';
            if (age < 3600) return Math.floor(age/60) + 'm ago';
            return Math.floor(age/3600) + 'h ago';
        }
        
        async function fetchHealth() {
            try {
                const res = await fetch('/api/v1/health');
                const data = await res.json();
                
                // Chain
                const chainEl = document.getElementById('health-chain');
                if (data.chain_live) {
                    chainEl.className = 'health-item good';
                    chainEl.querySelector('.health-value').textContent = 'LIVE';
                } else {
                    chainEl.className = 'health-item bad';
                    chainEl.querySelector('.health-value').textContent = 'OFFLINE';
                }
                
                // Lag
                const lagEl = document.getElementById('health-lag');
                const lag = data.ingest_lag_ms || 0;
                lagEl.className = lag < 5000 ? 'health-item good' : (lag < 30000 ? 'health-item warn' : 'health-item bad');
                lagEl.querySelector('.health-value').textContent = lag + 'ms';
                
                // EPS
                const epsEl = document.getElementById('health-eps');
                const eps = data.events_per_sec || 0;
                epsEl.className = eps > 0 ? 'health-item good' : 'health-item';
                epsEl.querySelector('.health-value').textContent = eps.toFixed(1);
                
                // Tokens
                document.getElementById('health-tokens').querySelector('.health-value').textContent = 
                    formatNumber(data.total_tokens || 0);
                
                // Global status
                if (data.chain_live) {
                    document.getElementById('global-status').className = 'status-badge status-live';
                    document.getElementById('global-status').textContent = 'LIVE';
                }
                
            } catch (e) {
                console.error('Health fetch failed:', e);
            }
        }
        
        async function fetchCandidates() {
            try {
                const res = await fetch('/api/v1/signals/ignition');
                let candidates = await res.json();
                
                // Handle both array and {candidates: [...]} formats
                if (candidates.candidates) {
                    candidates = candidates.candidates;
                }
                
                const container = document.getElementById('candidates-container');
                const count = candidates.length;
                
                document.getElementById('health-ignitions').querySelector('.health-value').textContent = count;
                document.getElementById('ignition-count').textContent = count + ' IGNITION';
                document.getElementById('candidates-count').textContent = count;
                
                if (!count) {
                    container.innerHTML = '<div class="empty-state">No ignition signals detected</div>';
                    return;
                }
                
                container.innerHTML = candidates.slice(0, 8).map(c => {
                    const state = c.signal_state || 'UNKNOWN';
                    const stateClass = state.toLowerCase();
                    const token = c.token_address || '';
                    const tradeability = c.tradeability_trend || 'UNKNOWN';
                    const reawakening = c.reawakening_state || 'DORMANT';
                    
                    return `
                        <div class="candidate ${stateClass}">
                            <div class="candidate-header">
                                <span class="token-address">${token.slice(0, 8)}...${token.slice(-6)}</span>
                                <span class="token-state ${state}">${state}</span>
                            </div>
                            <div class="candidate-metrics">
                                <div class="metric">
                                    <div class="metric-label">Novel Capital</div>
                                    <div class="metric-value">${formatNumber(c.novel_capital_15s)}</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">Indep. Buyers</div>
                                    <div class="metric-value">${c.independent_buyers_15s || '--'}</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">Tradeability</div>
                                    <div class="metric-value">${tradeability}</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">Reawakening</div>
                                    <div class="metric-value">${reawakening}</div>
                                </div>
                            </div>
                            <div class="candidate-age">${formatAge(c.ignition_detected_at)} | ${c.why_now || ''}</div>
                        </div>
                    `;
                }).join('');
                
            } catch (e) {
                console.error('Candidates fetch failed:', e);
            }
        }
        
        async function fetchRecentEvents() {
            try {
                const res = await fetch('/api/v1/tokens?limit=15');
                const tokens = await res.json();
                
                const container = document.getElementById('events-list');
                if (!tokens.length) {
                    container.innerHTML = '<div class="empty-state" style="padding:10px">No recent events</div>';
                    return;
                }
                
                container.innerHTML = tokens.slice(0, 15).map(t => {
                    const time = t.last_event_time ? new Date(t.last_event_time).toLocaleTimeString() : '--:--';
                    const tier = t.watch_tier ?? '--';
                    return `
                        <div class="event-item">
                            <span>${(t.token_address || '').slice(0, 12)}... T${tier}</span>
                            <span class="event-time">${time}</span>
                        </div>
                    `;
                }).join('');
                
            } catch (e) {
                // Silent fail for events
            }
        }
        
        async function fetchReawakenings() {
            try {
                const res = await fetch('/api/v1/signals/reawakenings');
                const data = await res.json();
                const reawakenings = data.reawakenings || [];
                
                document.getElementById('reawakenings-count').textContent = reawakenings.length;
                
                const container = document.getElementById('reawakenings-container');
                if (!reawakenings.length) {
                    container.innerHTML = '<div class="empty-state">No reawakening tokens detected</div>';
                    return;
                }
                
                container.innerHTML = reawakenings.slice(0, 5).map(r => {
                    const token = r.token_address || '';
                    const state = r.state || 'UNKNOWN';
                    const trend = r.tradeability_trend || 'UNKNOWN';
                    
                    return `
                        <div class="candidate">
                            <div class="candidate-header">
                                <span class="token-address">${token.slice(0, 8)}...${token.slice(-6)}</span>
                                <span class="token-state">${state}</span>
                            </div>
                            <div class="candidate-metrics">
                                <div class="metric">
                                    <div class="metric-label">NC 15s</div>
                                    <div class="metric-value">${formatNumber(r.novel_capital_15s)}</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">Indep. Buyers</div>
                                    <div class="metric-value">${r.independent_buyers_15s || '--'}</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">Tradeability</div>
                                    <div class="metric-value">${trend}</div>
                                </div>
                                <div class="metric">
                                    <div class="metric-label">Prior Hours</div>
                                    <div class="metric-value">${r.prior_activity_hours?.toFixed(1) || '--'}h</div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
                
            } catch (e) {
                console.error('Reawakenings fetch failed:', e);
            }
        }
        
        // Poll every 3 seconds
        setInterval(fetchHealth, 3000);
        setInterval(fetchCandidates, 5000);
        setInterval(fetchReawakenings, 5000);
        setInterval(fetchRecentEvents, 10000);
        
        // Initial fetch
        fetchHealth();
        fetchCandidates();
        
    </script>
</body>
</html>
